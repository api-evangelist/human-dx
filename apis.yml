aid: human-dx
name: Human DX
description: 'The Human Diagnosis Project (Human Dx) is a nonprofit initiative building
  an open, global medical intelligence system that combines the collective insight
  of physicians with machine learning to help make high-quality, affordable healthcare
  accessible to everyone. Its programs pair clinical microlearning and training tools
  for medical trainees with a specialist eConsult network that connects safety-net
  and underserved patients and their primary-care providers to volunteer specialists.
  The organization operates under the tagline "Rise together." Surfaced in the API
  Evangelist network as a portfolio-lead stub; no public API, developer portal, or
  machine-readable API surface was found during enrichment.'
